<p>
  报告作为 <code>api_key=</code> 传递给 LangSmith <code>Client(...)</code> 的字符串字面量。 对 API 密钥进行硬编码存在泄露机密的风险；该密钥应来自环境变量，例如 <code>LANGSMITH_API_KEY</code>。
</p>
<p><b>示例：</b></p>
<pre><code lang="Python">
from langsmith import Client

client = Client(api_key="lsv2_sk_...")
</code></pre>
