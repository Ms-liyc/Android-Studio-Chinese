pool.details.header=池化 ACP 客户端
pool.help=池如何对智能体去重\n----------------------------------------\n池为每个身份键最多保留一个活动智能体进程。如果两次获取的键在以下所有方面都匹配，则会重用同一个进程(共享客户端)；\n任何差异都会派生出一个单独的进程\:\n  • agentId             — 智能体的已解析注册表 ID\n  • startConfig         — 命令 /baseArgs/args/env/workingDir 的指纹\n  • cwd                 — 项目工作目录(精确路径，不进行规范化处理)\n  • eelDescriptor       — 执行环境(本地、WSL、Docker 等)\n  • policyDiscriminator — 对于 Shared 为 null；对于 DedicatedClientPerThread 为 threadId\n\n每个使用客户端的聊天线程都持有一个租约；当最后一个租约释放后，进程将停止。在左侧选择一个客户端，即可查看其状态、PID、运行时间以及标识它的确切键。
